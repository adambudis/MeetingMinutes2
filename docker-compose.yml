# MeetingMinutes - full stack: nginx/React frontend + FastAPI backend (STT) + Ollama (LLM).
#
#   docker compose up -d --build            # build & start (GPU host)
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build   # no NVIDIA GPU
#
# All settings come from .env (see .env.example). Everything restarts automatically after a
# reboot, and nothing is downloaded at runtime: models live in ./models and ./data/ollama.
name: meetingminutes

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-0.40.16}
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    <<: *gpu

  backend:
    build:
      context: ./backend
      args:
        TORCH_CUDA: ${TORCH_CUDA:-cu130}
    image: meetingminutes-backend:${TAG:-latest}
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gemma3:12b}
      LLM_NUM_CTX: ${LLM_NUM_CTX:-65536}
      WARMUP_MODELS: ${WARMUP_MODELS:-canary}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
      HF_TOKEN: ${HF_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./models:/models
    # PyTorch data loaders use shared memory; Docker's 64 MB default is too small.
    shm_size: 2gb
    extra_hosts:
      # lets OLLAMA_BASE_URL=http://host.docker.internal:11434 reach an Ollama installed on the host
      - "host.docker.internal:host-gateway"
    depends_on:
      ollama:
        condition: service_started
        required: false
    <<: *gpu

  frontend:
    build: ./frontend
    image: meetingminutes-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SERVER_HOSTS: ${SERVER_HOSTS:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-500}
    volumes:
      - ./data/certs:/certs
    depends_on:
      - backend
