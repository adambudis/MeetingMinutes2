[project]
name = "meetingminutes-backend"
version = "1.0.0"
description = "FastAPI backend for MeetingMinutes: speech-to-text, diarization and LLM summarization"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "BLE"]
# Czech prompts/messages legitimately contain characters like „ “ – … ×
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
